# Exported from the `garmentcode` conda env on Oscar (Brown CCV), the env that runs
# torchXPBD/run_torch_xpbd.py -- see README.md. Regenerate with:
#     conda env export -p /oscar/data/ssrinath/users/rzhou52/.conda/envs/garmentcode
#
# Fully pinned (build strings included), so `conda env create -f environment.yml`
# reproduces this env exactly on linux-64. On a different platform the build
# strings will not solve -- see README.md for the minimal package set torchXPBD
# actually needs (torch, libigl, usd-core, trimesh, scipy, pyyaml, numpy).
#
# Three EDITABLE/local installs are commented out below: they are absolute paths
# on this machine and would fail `conda env create` anywhere else. torchXPBD
# imports none of them (it needs only igl, numpy, torch, trimesh, yaml, scipy,
# pxr); they are here because this env is also used for GarmentCode itself.
